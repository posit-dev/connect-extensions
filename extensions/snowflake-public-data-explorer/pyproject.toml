[project]
name = "snowflake-public-data-explorer"
version = "0.0.1"
description = "Ask questions about Snowflake public data, from Shiny on Posit Connect"
readme = "README.md"
# The upper bound mirrors snowflake-ml-python.
requires-python = ">=3.12,<3.13"

dependencies = [
    "chatlas[snowflake]",
    "ibis-framework[snowflake]",
    "posit-sdk",
    "shiny",
    "querychat[viz,polars]",
    "shinychat",
    "snowflake-connector-python",
]

[tool.rsconnect]
app_mode = "python-shiny"
entrypoint = "app.py"
title = "Snowflake Public Data Explorer"
requirements_file = "uv.lock"

[dependency-groups]
dev = ["ruff"]

# The Shiny application is not importable as a package.
[tool.uv]
package = false

[tool.ruff]
line-length = 120
